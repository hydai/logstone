<!DOCTYPE html>
<!--
  Minimal stand-in for the mobile Lodestone mount page (Japanese).
  Real page: https://jp.finalfantasyxiv.com/lodestone/character/<id>/mount, fetched with the iPhone User-Agent.

  The same rows as mount-mobile-na.html, with the names the Japanese site writes; the total is
  written "TOTAL" with no colon there.
-->
<html lang="ja">
<body>
<div id="character" class="ldst__window">
  <div class="character__content selected">
    <div class="character__minions">
      <div class="select-pulldown__minion_mount">
        <p class="minion__sort__total com">TOTAL<span>3</span></p>
      </div>
      <ul class="mount__list js__minion_list js__mount_list">
        <li class="mount__list__item"data-tooltip_href="/lodestone/character/12345678/mount/tooltip/9045c5c5d5d181ee495f0e76af07d6d93c9f0f13">
          <span class="mount__anchor" id="9045c5c5d5d181ee495f0e76af07d6d93c9f0f13"></span>
          <div class="mount__list__inner js__mount_press js__character_list_inner">
            <div class="mount__list__icon">
              <div class="mount__list__icon__inner ">
                <img src="https://lds-img.finalfantasyxiv.com/itemicon/e6/e6cd1b44f2e625546c0a4c4ee9dff3de07b02082.png?n7.57" width="32" height="32" alt="" class="mount__list__icon__image lazy_loading" loading="lazy">
              </div>
            </div>
            <div class="mount__list__text"><span class="mount__name">マイチョコボ</span></div>
          </div>
        </li>
        <li class="mount__list__item"data-tooltip_href="/lodestone/character/12345678/mount/tooltip/823984ab35d83df64c9d26234244b68bf6dd4fee">
          <span class="mount__anchor" id="823984ab35d83df64c9d26234244b68bf6dd4fee"></span>
          <div class="mount__list__inner js__mount_press js__character_list_inner">
            <div class="mount__list__icon">
              <div class="mount__list__icon__inner ">
                <img src="https://lds-img.finalfantasyxiv.com/itemicon/2e/2e0e69537289e0fece83b6fc1db06c5ad0da2f9c.png?n7.57" width="32" height="32" alt="" class="mount__list__icon__image lazy_loading" loading="lazy">
              </div>
            </div>
            <div class="mount__list__text"><span class="mount__name">黒チョコボ</span></div>
          </div>
        </li>
        <li class="mount__list__item"data-tooltip_href="/lodestone/character/12345678/mount/tooltip/cc7a8acc538cb637ba03e2cf4fdb523536b994e9">
          <span class="mount__anchor" id="cc7a8acc538cb637ba03e2cf4fdb523536b994e9"></span>
          <div class="mount__list__inner js__mount_press js__character_list_inner">
            <div class="mount__list__icon">
              <div class="mount__list__icon__inner ">
                <img src="https://lds-img.finalfantasyxiv.com/itemicon/dd/ddf98afb1147e510f646b87c7be770261ff07b9d.png?n7.57" width="32" height="32" alt="" class="mount__list__icon__image lazy_loading" loading="lazy">
              </div>
            </div>
            <div class="mount__list__text"><span class="mount__name">でぶチョコボ</span></div>
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>
